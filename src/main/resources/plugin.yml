name: DrakesSlimeMarket
version: ${project.version}
main: cl.drakescraft.slimemarket.DrakesSlimeMarket
api-version: '1.21'
authors: [JackStar6677-1]
description: Dynamic Slimefun material market for DrakesCraft.
depend: [Slimefun, Vault]
softdepend: [PlaceholderAPI, sBank, Odysseia]
commands:
  sfmercado:
    description: Opens the Slimefun material market.
    usage: /sfmercado [reload|stats]
    permission: drakesslimemarket.use
permissions:
  drakesslimemarket.use:
    default: true
  drakesslimemarket.admin:
    default: op
